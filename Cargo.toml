[package]
name = "keryx-miner"
version = "0.3.15"
edition = "2021"
license = "MIT/Apache-2.0"
repository = "https://github.com/keryx-labs/keryx-miner"
readme = "README.md"
description = "A fast CPU & GPU miner for Keryx"
categories = ["command-line-utilities"]
keywords = ["blockchain", "cli"]
include = [
    "src/**/*.rs",
    "src/**/*.s",
    "proto/**",
    "Cargo.toml",
    "Cargo.lock",
    "build.rs",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "README.md",
]

# RDNA3 fork: rename the produced binary to `keryx-miner-rdna3` so its file/folder never collides
# with an official `keryx-miner` install (a shared folder leaves foreign CUDA/OpenCL plugin .so
# files the fork would try to load). The PACKAGE name stays `keryx-miner` so the internal
# `keryx_miner` lib crate, `cargo test -p keryx-miner`, and the pool user-agent are all unchanged.
[[bin]]
name = "keryx-miner-rdna3"
path = "src/main.rs"

[dependencies]
tonic = "0.8"
tokio = { version = "1.17", features = ["macros", "rt-multi-thread", "signal"] }
prost = "0.11"
futures-util = "0.3"
tokio-stream = {version = "0.1", features = ["net"]}
once_cell = "1"
num_cpus = "1"
rand = "0.8"
blake2b_simd = "1.0.0"
clap = { version = "3.0", features = ["color", "derive"]}
log = "0.4"
env_logger = "0.9"
keccak = { version = "0.1", optional = true }
parking = { package = "parking_lot", version = "0.12", optional = true }
libloading = "0.7"
tokio-util = {version = "0.7.0", features = ["codec"]}
serde_json = "1.0"
serde =  {version="1.0", features=["derive"]}
futures = "0.3.21"
bytes = "1.1.0"
async-trait = "0.1"
num = "0.4"
nix = "0.25"
hex = "0.4"
keryx-inference = { path = "inference" }
secp256k1 = { version = "0.29.0", features = ["global-context"] }
semver = "1.0"
# Proof-of-Model: possession proof construction (borsh wire-format must match the node).
borsh = { version = "1", features = ["derive"] }
blake3 = "1"
# RDNA3 fork — OPoI inference is served by a prebuilt llama.cpp **Vulkan** `llama-server`
# over localhost HTTP (see slm.rs); no in-process LLM engine, no CUDA, no CPU inference.
# candle-core is kept ONLY as a CPU GGUF / quantized-tensor reader for the PoM weight blob;
# candle-transformers / candle-nn / tokenizers went out with the candle engine.
candle-core = { version = "0.9", default-features = false }
# Vulkan compute backend: PoM walk + kHeavyHash PoW kernels for RDNA3 (verified on a 7900 XT).
keryx-vulkan = { path = "keryx-vulkan" }
ureq = { version = "2", features = ["tls", "json"] }
base64 = "0.22"
anyhow = "1"
# OPoI inference: llama.cpp via FFI with its Vulkan backend, IN-PROCESS — the PoM walk reads
# the engine's own resident weight buffers (zero-dup). Pulled from our fork branch carrying ONLY
# the keryx ggml exports (raw handles, tensor BDA, guarded queue submit) via the patched
# llama.cpp submodule, rebased onto upstream 0.1.151 — the windows-gnu vulkan build fixes
# (PR utilityai/llama-cpp-rs#1060) are upstream as of that release and no longer carried here.
# default-features = false drops `common` (avoids upstream issue #1059's unlinked build-info
# objects — we only need core llama: load, chat template, tokenize, greedy decode) and `openmp`
# (no libgomp runtime dep; all layers run on the GPU anyway).
# Pinned by rev (branch: keryx-zero-dup-0.1.151): Cargo.lock is gitignored in this repo, so a
# branch reference would float — the rev makes release builds reproducible.
llama-cpp-2 = { git = "https://github.com/shmutalov/llama-cpp-rs", rev = "cfe442f88748fc840ddd738357d4f822ed75f96f", default-features = false, features = ["vulkan"] }
# Direct sys-crate access for the keryx FFI exports — llama-cpp-2 does not re-export its sys crate.
llama-cpp-sys-2 = { git = "https://github.com/shmutalov/llama-cpp-rs", rev = "cfe442f88748fc840ddd738357d4f822ed75f96f", default-features = false }
time = { version = "0.3", features = ["formatting", "macros"] }
flate2 = "1.0"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
default = ["parking_lot"]
parking_lot = ["parking", "tokio/parking_lot"]
bench = []
no-asm = ["keccak"]

[target.'cfg(target_os = "windows")'.dependencies]
keccak = "0.1"
kernel32-sys = "0.2"
win32console = "0.1"

[profile.release]
lto = true
codegen-units = 1

[build-dependencies]
tonic-build = { version = "0.8", default-features = false, features = ["prost", "transport"] }
cc = "1"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
sha3 = { git = "https://github.com/elichai/hashes", branch = "cSHAKE" }

[workspace]
# RDNA3 fork: the CUDA/OpenCL PoW plugins are gone (replaced by the in-process Vulkan worker);
# keryx-vulkan joins the workspace. No candle-kernels patch — there is no CUDA kernel build.
members = ["inference", "keryx-vulkan"]
default-members = ["."]
