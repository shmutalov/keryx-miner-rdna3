name: Build and upload assets

on:
  release:
    types: [published]
  # Dry-run without a release: builds everything and uploads workflow artifacts only.
  workflow_dispatch:

permissions:
  contents: write

# RDNA3 / Vulkan fork: ONE self-contained binary per OS — llama.cpp (Vulkan) runs in-process
# and the PoM walk shares the inference engine's resident weight buffers (zero-dup). Building
# needs cmake + ninja + libclang (bindgen) + the Vulkan SDK.
#
# The Linux jobs run inside an ubuntu:22.04 container: current HiveOS worker images are Ubuntu
# 22.04 based (glibc 2.35) — and RDNA3 cards need the recent kernel/Mesa those images carry, so
# older Hive images can't run this fork anyway. Building on newer runners than 22.04 would still
# break rigs with "GLIBC_2.3x not found".

jobs:
  build-windows:
    name: Build windows
    runs-on: windows-latest
    env:
      # Fetch git deps with the git CLI (honours core.longpaths for the llama.cpp submodule).
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # Short target dir: ggml's nested vulkan-shaders-gen TryCompile paths exceed MAX_PATH
      # under the default deep target/ ("C1083: Cannot open compiler generated file").
      CARGO_TARGET_DIR: D:\ct
    steps:
      - name: Fix CRLF on Windows + long paths (llama.cpp submodule has >260-char paths)
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v7

      - name: Install Protoc
        uses: rustfs/setup-protoc@v3.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Vulkan SDK (glslc)
        uses: ./.github/actions/vulkan-sdk

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve tag
        shell: bash
        run: echo "TAG=${{ github.event.release.tag_name || format('dev-{0}', github.sha) }}" >> "$GITHUB_ENV"

      # cl.exe on PATH for the Ninja generator: the VS generator's vulkan-shaders-gen
      # ExternalProject rule breaks (MSB8066); Ninja matches the locally-validated path.
      - name: MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      # pwsh, not bash: under bash, Git's coreutils link.exe shadows MSVC's linker in the
      # vcvars environment and rustc fails with "link.exe returned an unexpected error".
      - name: Build
        shell: pwsh
        env:
          # bindgen needs libclang; LLVM is preinstalled on windows runners.
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          CMAKE_GENERATOR: Ninja
        run: |
          cargo build --release --bin keryx-miner-rdna3
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $asset = "keryx-miner-$env:TAG-win64-amd64"
          New-Item -ItemType Directory $asset | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR/release/keryx-miner-rdna3.exe" $asset/
          foreach ($f in @('start-miner.bat', 'README.md')) { if (Test-Path $f) { Copy-Item $f $asset/ } }
          7z a -tzip "$asset.zip" $asset
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload artifacts (always)
        uses: actions/upload-artifact@v7
        with:
          name: windows-assets
          path: keryx-miner-*.zip

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: keryx-miner-*.zip

  build-linux:
    name: Build linux + hiveos
    runs-on: ubuntu-latest
    # glibc 2.35 floor — matches the 22.04-based HiveOS images RDNA3 rigs run.
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install system toolchain
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget xz-utils unzip git \
            build-essential cmake ninja-build pkg-config \
            clang libclang-dev libvulkan-dev p7zip-full
      - uses: actions/checkout@v7

      # Vulkan SDK tarball: current LunarG SDKs are built for Ubuntu 22.04 — glslc runs
      # natively in this container, and the SDK also carries the modern Vulkan headers plus
      # the SPIRV-Headers cmake config that ggml-vulkan's find_package(... CONFIG) requires.
      - name: Install Vulkan SDK (glslc + headers)
        run: |
          set -euxo pipefail
          ver=1.4.350.1
          wget -qO /tmp/vulkansdk.tar.xz "https://sdk.lunarg.com/sdk/download/${ver}/linux/vulkansdk-linux-x86_64-${ver}.tar.xz"
          mkdir -p /opt/vulkan-sdk
          tar -xf /tmp/vulkansdk.tar.xz -C /opt/vulkan-sdk
          glslc_bin="$(find /opt/vulkan-sdk -type f -name glslc | head -n1)"
          test -n "$glslc_bin"
          sdkroot="$(dirname "$(dirname "$glslc_bin")")"
          echo "GLSLC=$glslc_bin" >> "$GITHUB_ENV"
          echo "VULKAN_SDK=$sdkroot" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$sdkroot" >> "$GITHUB_ENV"
          echo "$sdkroot/bin" >> "$GITHUB_PATH"
          "$glslc_bin" --version

      - name: Install Protoc
        uses: rustfs/setup-protoc@v3.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve tag
        run: echo "TAG=${{ github.event.release.tag_name || format('dev-{0}', github.sha) }}" >> "$GITHUB_ENV"

      - name: Build
        env:
          # jammy's libclang-dev is clang-14; point bindgen at it explicitly.
          LIBCLANG_PATH: /usr/lib/llvm-14/lib
          CMAKE_GENERATOR: Ninja
          # Resolve the bundled libvulkan.so.1 (copied next to the binary below) from the binary's
          # OWN directory at runtime, so the plain linux tarball starts without the user setting
          # LD_LIBRARY_PATH. Kept literal ($ORIGIN reaches ld verbatim via the env map).
          RUSTFLAGS: "-C link-arg=-Wl,-rpath,$ORIGIN"
        run: |
          set -euxo pipefail
          cargo build --release --bin keryx-miner-rdna3
          asset="keryx-miner-${TAG}-linux-amd64"
          mkdir "$asset"
          cp target/release/keryx-miner-rdna3 "$asset/"
          cp README.md "$asset/" 2>/dev/null || true
          strip "$asset/keryx-miner-rdna3" || true
          # Bundle the Vulkan LOADER (libvulkan.so.1) next to the binary so the miner starts on
          # rigs that lack libvulkan1 (common on HiveOS). h-run.sh / users must run it with the
          # package dir on LD_LIBRARY_PATH. The GPU still needs a system ICD driver (RADV/amdvlk).
          cp -L /usr/lib/x86_64-linux-gnu/libvulkan.so.1 "$asset/"
          tar czvf "$asset.tgz" "$asset"

      # HiveOS custom-miner package: the *-hiveos.tgz a flightsheet's "Installation URL" points
      # at; extracts to its OWN /hive/miners/custom/keryx-miner-rdna3/ (distinct from the official
      # miner, so no stale CUDA/OpenCL plugin .so is inherited). Ships the ZERO-DUP binary: a single
      # process (inference in-process, PoM walk over shared weights) — no llama-server child for
      # h-run.sh to manage. Bundles the Vulkan loader; needs a Vulkan-capable amdgpu driver ICD
      # (h-config.sh installs mesa-vulkan-drivers if none is present).
      - name: Package HiveOS flightsheet
        run: |
          set -euxo pipefail
          pkg="keryx-miner-rdna3"
          ( cd integrations/hiveos && bash createmanifest.sh "${TAG#v}" keryx-miner-rdna3 )
          mkdir -p "$pkg"
          cp integrations/hiveos/h-config.sh \
             integrations/hiveos/h-run.sh \
             integrations/hiveos/h-stats.sh \
             integrations/hiveos/h-manifest.conf "$pkg/"
          cp target/release/keryx-miner-rdna3 "$pkg/keryx-miner-rdna3"
          strip "$pkg/keryx-miner-rdna3" || true
          # Bundle the Vulkan loader; h-run.sh puts the package dir first on LD_LIBRARY_PATH, so
          # this is found even on HiveOS images without libvulkan1 (or with broken apt).
          cp -L /usr/lib/x86_64-linux-gnu/libvulkan.so.1 "$pkg/"
          chmod +x "$pkg"/*.sh "$pkg/keryx-miner-rdna3"
          tar czvf "keryx-miner-${TAG}-hiveos.tgz" "$pkg"

      - name: Upload artifacts (always)
        uses: actions/upload-artifact@v7
        with:
          name: linux-assets
          path: |
            keryx-miner-*.tgz

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: keryx-miner-*.tgz
